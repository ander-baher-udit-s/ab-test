<!DOCTYPE html>
<html lang="en">
<head>
  <base href="/ab-test/admin/analytics/">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Attendance Analytics</title>
  <!-- The POC readiness promise is retained. The module and Arrow are bundled locally. -->
  <script>
    globalThis.duckdbWasmReady = new Promise((resolve, reject) => {
      globalThis.__resolveDuckdbWasm = resolve;
      globalThis.__rejectDuckdbWasm = reject;
    });
  </script>
  <script type="module">
    import(new URL('duckdb/duckdb.mjs', document.baseURI).href)
      .then(globalThis.__resolveDuckdbWasm, globalThis.__rejectDuckdbWasm);
  </script>
  <script src="dashboard_bridge.js"></script>
  <script src="flutter_bootstrap.js" async></script>
</head>

</html>
